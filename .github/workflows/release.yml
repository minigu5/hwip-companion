name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows companion
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-companion
          path: |
            dist/HwipCompanion.exe
            dist/HwipCompanion.sha256
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${env:GITHUB_REF_NAME}" dist/HwipCompanion.exe dist/HwipCompanion.sha256 --generate-notes
